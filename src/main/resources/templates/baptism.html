<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Baptism Records</title>
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>
	<div class="content">
		<h2>Baptism Records</h2>
		<div class="my-3">
			<form th:action="@{/baptism}" class="search-wrapper">
				<i class="fa fa-search"></i> <input id="keyword" type="search"
					name="keyword" th:value="${keyword}" required
					class="form-control keyword-input" placeholder="Enter keyword"/>
				<button type="submit" class="btn btn-secondary">Search</button>
				<button type="button" id="btnClear" class="btn btn-info"
					style="margin-left: 10px;">Clear</button>
			</form>
			<button class="add-btn" onclick="openModal1('POST')">Add New</button>
		</div>
		<table>
			<thead>
				<tr>
					<th>First Name</th>
					<th>Middle Name</th>
					<th>Last Name</th>
					<th>Date Of Birth</th>
					<th>Date Of Baptism</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody id="recordTable">
				<!-- Your dynamic rows here -->
				<tr th:each="baptismRecord : ${baptismRecods}">
					<td th:text="${baptismRecord.firstName}"></td>
					<td th:text="${baptismRecord.middleName}"></td>
					<td th:text="${baptismRecord.lastName}"></td>
					<td th:text="${baptismRecord.dateOfBirth}"></td>
					<td th:text="${baptismRecord.dateOfBaptism}"></td>
					<td>
						<button type="button" th:attr="data-record=${baptismRecord}"
							onclick="editFromData(this)">Edit</button>
						<button type="button" th:attr="data-record=${baptismRecord}"
							onclick="printDocument(this)">Print</button>

					</td>
				</tr>
			</tbody>
		</table>
		<div style="margin-top: 15px;">
			<label for="pageSize">Rows per page:</label> <select id="pageSize">
				<option value="5">5</option>
				<option value="10">10</option>
				<option value="20">20</option>
				<option value="50">50</option>
				<option value="100">100</option>
			</select>

			<button id="prevPage">Previous</button>
			<span id="pageInfo"></span>
			<button id="nextPage">Next</button>
		</div>

	</div>

	<div id="baptismModal" class="modal">
		<div class="modal-content">
			<span class="close" onclick="closeModal()">&times;</span>
			<h2 class="modal-title">Baptism Record Form</h2>

			<form th:action="@{/baptism/save}" method="post"
				enctype="multipart/form-data" th:object="${baptismRecordDto}"
				class="modal-form">
				<!-- Personal Info -->
				<fieldset>
					<legend>Personal Information</legend>
					<div class="form-row-3">
						<div class="form-group">
							<label>First Name</label> <input type="text"
								th:field="*{firstName}" name="firstName" required>
						</div>
						<div class="form-group">
							<label>Middle Name</label> <input type="text"
								th:field="*{middleName}" name="middleName">
						</div>
						<div class="form-group">
							<label>Last Name</label> <input type="text"
								th:field="*{lastName}" name="lastName" required>
						</div>
					</div>

					<div class="form-row-2">
						<div class="form-group">
							<label>Date of Birth</label> <input type="date"
								th:field="*{dateOfBirth}" name="dateOfBirth">
						</div>
						<div class="form-group">
							<label>Place of Birth</label> <input type="text"
								th:field="*{placeOfBirth}" name="placeOfBirth">
						</div>
					</div>

					<div class="form-row-2">
						<div class="form-group">
							<label>Date of Baptism</label> <input type="date"
								th:field="*{dateOfBaptism}" name="dateOfBaptism">
						</div>
						<div class="form-group">
							<label>Place of Baptism</label> <input type="text"
								th:field="*{placeOfBaptism}" name="placeOfBaptism">
						</div>
					</div>
					<div class="form-row-2">
						<div class="form-group">
							<label>Age Category</label> <select name="ageCategory"
								th:field="*{ageCategory}" id="ageCategory">
								<option value="A">0 to 1 year old</option>
								<option value="B">1 to 7 years old</option>
								<option value="C">7+ years old</option>
							</select>
						</div>
						<div class="form-group">
							<label></label>
						</div>
					</div>
				</fieldset>

				<!-- Parents -->
				<fieldset>
					<legend>Parents / Guardian Information</legend>

					<label class="group-label">Father's Name</label>
					<div class="form-row-3">
						<div class="form-group">
							<label>First Name</label> <input type="text"
								th:field="*{fatherFirstName}" name="fatherFirstName">
						</div>
						<div class="form-group">
							<label>Middle Name</label> <input type="text"
								th:field="*{fatherMiddleName}" name="fatherMiddleName">
						</div>
						<div class="form-group">
							<label>Last Name</label> <input type="text"
								th:field="*{fatherLastName}" name="fatherLastName">
						</div>
					</div>

					<label class="group-label">Mother's Maiden Name</label>
					<div class="form-row-3">
						<div class="form-group">
							<label>First Name</label> <input type="text"
								th:field="*{motherFirstName}" name="motherFirstName">
						</div>
						<div class="form-group">
							<label>Middle Name</label> <input type="text"
								th:field="*{motherMiddleName}" name="motherMiddleName">
						</div>
						<div class="form-group">
							<label>Last Name</label> <input type="text"
								th:field="*{motherLastName}" name="motherLastName">
						</div>
					</div>

					<label class="group-label">Address</label>
					<div class="form-row-3">
						<div class="form-group">
							<label></label> <input type="text" th:field="*{parentsAddress}"
								name="parentsAddress">
						</div>
					</div>

				</fieldset>

				<!-- Sponsors -->
				<fieldset>
					<legend>Sponsors of Baptism</legend>
					<textarea th:field="*{sponsors}" id="sponsors" name="sponsors"
						rows="4" placeholder="List of Sponsors"></textarea>
				</fieldset>

				<!-- Minister -->
				<fieldset>
					<legend>Minister of Baptism</legend>
					<input id="minister" type="text" th:field="*{minister}"
						name="minister" placeholder="Full name of the minister" />
				</fieldset>
				
				<!-- Minister -->
				<fieldset>
					<legend>Priest In Charge</legend>
					<input id="priestInCharge" type="text" th:field="*{priestInCharge}"
						name="priestInCharge" placeholder="Full name of Priest in Charge" />
				</fieldset>

				<fieldset>
					<legend>Record Details</legend>
					<input id="bookNo" type="text" th:field="*{bookNo}" name="bookNo"
						placeholder="Book Number" /> <input id="pageNo" type="text"
						th:field="*{pageNo}" name="pageNo" placeholder="Page Number" /> <input
						id="lineNo" type="text" th:field="*{lineNo}" name="lineNo"
						placeholder="Line Number" />
				</fieldset>

				<div class="form-actions">
					<button id="submitButton" type="submit">Save Record</button>
					<button type="button" id="updateButton">Update Record</button>
				</div>
			</form>
		</div>
	</div>

	<!-- Loading Modal -->
	<div id="loadingModal" class="loading-modal">
		<div class="loading-content">
			<div class="spinner"></div>
			<p>Generating PDF, please wait…</p>
		</div>
	</div>


	<script th:src="@{/js/dashboard.js}"></script>
	<script th:src="@{/js/common.js}"></script>

	<!-- Generate report statistics by age: 0-1, 1-7, 7 and up  -->
</body>
</html>
