<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wedding Records</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
</head>
<body>
<nav class="navbar">
		<ul class="nav-menu">
			<li><a href="javascript:void(0)" onclick="navigate('home')">HOME</a></li>
			<li class="divider">|</li>

			<li><a href="javascript:void(0)" onclick="navigate('baptism')">BAPTISM</a></li>
			<li class="divider">|</li>

			<li><a href="javascript:void(0)" onclick="navigate('wedding')">WEDDING</a></li>
			<li class="divider">|</li>

			<li><a href="javascript:void(0)" onclick="navigate('home')">CONFIRMATION</a></li>
			<li class="divider">|</li>

			<li><a href="javascript:void(0)" onclick="navigate('home')">FUNERAL</a></li>
		</ul>
	</nav>

<div class="content">
    <h2>Wedding Records</h2>
    	<div class="my-3">
		<form th:action="@{/wedding}" class="search-wrapper">
			<i class="fa fa-search"></i> <input id="keyword" type="search"
				name="keyword" th:value="${keyword}" required
				class="form-control keyword-input" placeholder="Enter keyword"/>
			<button type="submit" class="btn btn-secondary">Search</button>
			<button  type="button" id="weddingBtnClear" class="btn btn-info" style="margin-left: 10px;">Clear</button>

		</form>

		<button class="add-btn" onclick="openWeddingModal('POST')">Add New</button>
		</div>
		<table>
			<thead class="thead-wedding">
				<tr>
					<th>GROOM</th>
					<th>BRIDE</th>
					<th>WEDDING DATE</th>
					<th>ACTIONS</th>
				</tr>
			</thead>
			<tbody id="recordTable">
				<tr th:each="weddingRecord : ${weddingRecords}">
					<td
						th:text="${weddingRecord.groomFirstName + ' ' + weddingRecord.groomMiddleName + ' ' + weddingRecord.groomLastName}"></td>
					<td
						th:text="${weddingRecord.brideFirstName + ' ' + weddingRecord.brideMiddleName + ' ' + weddingRecord.brideLastName}"></td>
					<td th:text="${weddingRecord.dateOfWedding}"></td>
					<td>
						<button type="button" th:attr="data-record=${weddingRecord}"
							onclick="editWeddingData(this)">Edit</button>
						<button type="button" th:attr="data-record=${weddingRecord}"
							onclick="printWeddingDocument(this)">Print</button>
					</td>
				</tr>
			</tbody>
		</table>
		<div style="margin-top: 15px;">
			<label for="pageSize">Rows per page:</label> <select id="pageSize">
				<option value="5">5</option>
				<option value="10">10</option>
				<option value="20">20</option>
				<option value="50">50</option>
				<option value="100">100</option>
			</select>

			<button id="prevPage">Previous</button>
			<span id="pageInfo"></span>
			<button id="nextPage">Next</button>
		</div>
	</div>

<div id="weddingModal" class="modal">
		<div class="modal-content">
			<span class="close" onclick="closeWeddingModal()">&times;</span>
			<h2 class="modal-title">Wedding Record Form</h2>

			<form th:action="@{/wedding/save}" method="post"
				enctype="multipart/form-data" th:object="${weddingRecordDto}"
				class="modal-form"> 
				<!-- Personal Info -->
				<fieldset>
					<legend>Couple Information</legend>
					<label class="group-label">Groom</label>
					<div class="form-row-3">
						<div class="form-group">
							<label>First Name</label> <input type="text"
								th:field="*{groomFirstName}" name="groomFirstName" required>
						</div>
						<div class="form-group">
							<label>Middle Name</label> <input type="text"
								th:field="*{groomMiddleName}" name="groomMiddleName">
						</div>
						<div class="form-group">
							<label>Last Name</label> <input type="text"
								th:field="*{groomLastName}" name="groomLastName" required>
						</div>
					</div>

					<div class="form-row-2">
						<div class="form-group">
							<label>Date of Birth</label> <input type="date"
								th:field="*{groomDateOfBirth}" name="groomDateOfBirth">
						</div>
						
						<div class="form-group">
							<label>Groom Religion</label> <input type="text"
								th:field="*{groomReligion}" name="groomReligion">
						</div>
					</div>
					
					<label class="group-label">Bride</label>
					<div class="form-row-3">
						<div class="form-group">
							<label>First Name</label> <input type="text"
								th:field="*{brideFirstName}" name="brideFirstName" required>
						</div>
						<div class="form-group">
							<label>Middle Name</label> <input type="text"
								th:field="*{brideMiddleName}" name="brideMiddleName">
						</div>
						<div class="form-group">
							<label>Last Name</label> <input type="text"
								th:field="*{brideLastName}" name="brideLastName" required>
						</div>
					</div>

					<div class="form-row-2">
						<div class="form-group">
							<label>Date of Birth</label> <input type="date"
								th:field="*{brideDateOfBirth}" name="brideDateOfBirth">
						</div>
						
						<div class="form-group">
							<label>Bride Religion</label> <input type="text"
								th:field="*{brideReligion}" name="brideReligion">
						</div>
					</div>
					
					<label class="group-label">Wedding Date</label>
					<div class="form-row-3">
						<div class="form-group">
							<input type="date"
								th:field="*{dateOfWedding}" name="dateOfWedding">
						</div>
					</div>
				</fieldset>

				<!-- Sponsors -->
				<fieldset>
					<legend>Witnesses</legend>
					<textarea th:field="*{witnesses}" id="witnesses" name="witnesses"
						rows="4" placeholder="List of Witnesses"></textarea>
				</fieldset>

				<!-- Minister -->
				<fieldset>
					<legend>Priest In Charge</legend>
					<input id="priestInCharge" type="text" th:field="*{priestInCharge}"
						name="priestInCharge" placeholder="Full name of Priest in Charge" />
				</fieldset>

				<fieldset>
					<legend>Record Details</legend>
					<input id="bookNo" type="text" th:field="*{bookNo}" name="bookNo"
						placeholder="Book Number" /> <input id="pageNo" type="text"
						th:field="*{pageNo}" name="pageNo" placeholder="Page Number" /> <input
						id="lineNo" type="text" th:field="*{lineNo}" name="lineNo"
						placeholder="Line Number" />
				</fieldset>

				<div class="form-actions">
					<button id="weddingSubmitButton" type="submit">Save Record</button>
					<button type="button" id="weddingUpdateButton">Update Record</button>
				</div>
			</form>
		</div>
	</div>

	<!-- Loading Modal -->
	<div id="loadingModal" class="loading-modal">
		<div class="loading-content">
			<div class="spinner"></div>
			<p>Generating PDF, please wait…</p>
		</div>
	</div>

	<script th:src="@{/js/wedding.js}"></script>
	<script th:src="@{/js/common.js}"></script>
</body>
</html>
