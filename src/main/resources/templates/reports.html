<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reports</title>

<link rel="stylesheet" th:href="@{/css/styles.css}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

</head>

<body>


<div th:replace="fragments/navbar :: navbar"></div>
	<br>
	<br>
	<h2 class="page-title text-center mb-4">REPORTS</h2>
	<div class="container">

		<div class="row justify-content-center">
			<div class="col-md-6">

				<div class="card shadow-sm">
					<div class="card-body">

						<h5 class="card-title text-center mb-4">Generate Church
							Report</h5>

						<form th:action="@{/reports/download-pdf}" method="post"
							enctype="multipart/form-data" th:object="${reportDto}">

							<!-- Report Type -->
							<div class="mb-3">
								<label class="form-label">Report Type</label> <select
									class="form-select" name="reportType" required>
									<option value="" selected disabled>Select Report Type</option>
									<option value="BAPTISM">Baptism</option>
									<option value="WEDDING">Wedding</option>
									<option value="CONFIRMATION">Confirmation</option>
								</select>
							</div>

							<div class="mb-3">
								<label class="form-label">Report Year</label> <input type="text"
									class="form-control" name="reportYear" required>
							</div>

							<!-- From Date -->
							<div class="mb-3">
								<label class="form-label">From Date</label> <input type="date"
									class="form-control" name="dateFrom" required>
							</div>

							<!-- To Date -->
							<div class="mb-3">
								<label class="form-label">To Date</label> <input type="date"
									class="form-control" name="dateTo" required>
							</div>

							<!-- Submit -->
							<div class="d-grid">
								<button type="submit" class="btn btn-primary">Generate Report</button>
							</div>

						</form>

					</div>
				</div>

			</div>
		</div>

	</div>
	
	
	<script th:src="@{/js/common.js}"></script>

</body>
</html>
