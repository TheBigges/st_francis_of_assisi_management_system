<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" th:href="@{/css/styles.css}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
</head>
<body>

	<div th:replace="fragments/navbar :: navbar"></div>

	<br />
	<br />

	<h2 class="page-title">DASHBOARD</h2>

	<form method="get" class="year-filter">
		<label>Year:</label> <select name="year" onchange="this.form.submit()">
			<option
				th:each="y : ${#numbers.sequence(2020, T(java.time.Year).now().value)}"
				th:value="${y}" th:text="${y}" th:selected="${y == selectedYear}">
			</option>
		</select>
	</form>


	<div class="stats-container">

		<div class="stat-card blue">
			<div class="stat-title">BAPTISM</div>
			<div class="stat-value" th:text="${stats.baptismCount}">0</div>
		</div>

		<div class="stat-card orange">
			<div class="stat-title">WEDDING</div>
			<div class="stat-value" th:text="${stats.weddingCount}">0</div>
		</div>

		<div class="stat-card green">
			<div class="stat-title">CONFIRMATION</div>
			<div class="stat-value" th:text="${stats.confirmationCount}">0</div>
		</div>

		<div class="stat-card red">
			<div class="stat-title">FUNERAL</div>
			<div class="stat-value" th:text="${stats.funeralCount}">0</div>
		</div>

	</div>

	<br />

	<div class="row">
		<!-- Baptisms Card (left) -->
		<div class="col-md-6">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5>Monthly Baptisms</h5>
					<div style="height: 300px;">
						<canvas id="baptismChart"></canvas>
					</div>
				</div>
			</div>
		</div>

		<!-- Weddings Card (right) -->
		<div class="col-md-6">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5>Monthly Weddings</h5>
					<div style="height: 300px;">
						<canvas id="weddingChart"></canvas>
					</div>
				</div>
			</div>
		</div>
	</div>
	<br/>
	<div class="row">
		<!-- Confirmation Card (left) -->
		<div class="col-md-6">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5>Monthly Confirmations</h5>
					<div style="height: 300px;">
						<canvas id="confirmationChart"></canvas>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script th:inline="javascript">
    const baptismCounts = [[${monthlyCounts}]];
    const weddingCounts = [[${weddingCounts}]];
    const confirmationCounts = [[${confirmationCounts}]];
    const selectedYear = [[${selectedYear}]];

    new Chart(document.getElementById('baptismChart'), {
        type: 'bar',
        data: {
            labels: [
                'January', 'February', 'March', 'April',
                'May', 'June', 'July', 'August',
                'September', 'October', 'November', 'December'
            ],
            datasets: [{
                label: 'Baptisms (' + selectedYear + ')',
                data: baptismCounts,
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 5, precision: 0 }
                }
            }
        }
    });

    new Chart(document.getElementById('weddingChart'), {
        type: 'bar',
        data: {
            labels: [
                'January', 'February', 'March', 'April',
                'May', 'June', 'July', 'August',
                'September', 'October', 'November', 'December'
            ],
            datasets: [{
                label: 'Weddings (' + selectedYear + ')',
                data: weddingCounts,
                backgroundColor: 'orange',  // bar fill color
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 5, precision: 0 }
                }
            }
        }
    });
    new Chart(document.getElementById('confirmationChart'), {
        type: 'bar',
        data: {
            labels: [
                'January', 'February', 'March', 'April',
                'May', 'June', 'July', 'August',
                'September', 'October', 'November', 'December'
            ],
            datasets: [{
                label: 'Confirmations (' + selectedYear + ')',
                data: confirmationCounts,
                backgroundColor: 'green',  // bar fill color
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 5, precision: 0 }
                }
            }
        }
    });
</script>



	<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
