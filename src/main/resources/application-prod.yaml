spring:
  application:
    name: st_francis_of_assisi_management_system

  datasource:
    url: jdbc:${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect:  org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    session:
      timeout: 30m